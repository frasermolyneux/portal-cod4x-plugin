name: Code Quality

on:
  schedule:
    - cron: "45 6 * * 1"
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    permissions:
      contents: read
      actions: read
      security-events: write
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: frasermolyneux/actions/.github/workflows/codequality.yml@main
    with:
      sonar-project-key: frasermolyneux_portal-cod4x-plugin
      sonar-organization: frasermolyneux
      sonar-host-url: https://sonarcloud.io
      build-target: cmake-ci
      codeql-languages: cpp
      codeql-category: /language:cpp
      cmake-source-dir: .
      cmake-build-dir: build
      cmake-configure-args: -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DPORTAL_COD4X_BUILD_PLUGIN_BINARY=OFF
      cmake-build-args: --config Release
      ctest-args: --output-on-failure --build-config Release
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  devops-secure-scanning:
    permissions:
      contents: read
      actions: read
      id-token: write
      security-events: write
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: frasermolyneux/actions/.github/workflows/devops-secure-scanning.yml@main

  dependency-review:
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          comment-summary-in-pr: always
